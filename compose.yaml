services:
  rootlane:
    image: rootlane:0.1.1
    build: .
    user: "${ROOTLANE_UID:?Run node deploy/setup.mjs}:${ROOTLANE_GID:?Run node deploy/setup.mjs}"
    group_add: ["${ROOTLANE_JOURNAL_GID:?Run node deploy/setup.mjs}"]
    network_mode: host
    pid: host
    cgroup: host
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "node", "-e", "const c=JSON.parse(require('fs').readFileSync(process.env.ROOTLANE_CONFIG));fetch('http://127.0.0.1:'+c.port+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, apparmor:unconfined]
    tmpfs: [/tmp]
    environment:
      HOME: /tmp
      XDG_RUNTIME_DIR: /run/user/${ROOTLANE_UID}
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/${ROOTLANE_UID}/bus
      ROOTLANE_CONFIG: /config/config.json
      ROOTLANE_OWNER_CREDENTIAL_FILE: /config/owner.credential
      ROOTLANE_AGENT_CREDENTIAL_FILE: /config/agent.credential
    volumes:
      - type: bind
        source: ${ROOTLANE_CONFIG_DIR}
        target: /config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${ROOTLANE_STATE_DIR}
        target: ${ROOTLANE_STATE_DIR}
        bind: {create_host_path: false}
      - type: bind
        source: ${ROOTLANE_PROJECT_ROOT}
        target: ${ROOTLANE_PROJECT_ROOT}
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /run/user/${ROOTLANE_UID}
        target: /run/user/${ROOTLANE_UID}
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /run/tailscale/tailscaled.sock
        target: /run/tailscale/tailscaled.sock
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /usr/bin/tailscale
        target: /usr/local/bin/tailscale
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/machine-id
        target: /etc/machine-id
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /var/log/journal
        target: /var/log/journal
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /run/log/journal
        target: /run/log/journal
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /sys/fs/cgroup
        target: /sys/fs/cgroup
        read_only: true
        bind: {create_host_path: false}
